    <meta name="description" content="The definitive platform and authoritative catalogue archive for action figure collectors." />
    <meta property="og:title" content="Cardback — Action Figure Collector Archive" />
    <meta property="og:description" content="The definitive platform and authoritative catalogue archive for action figure collectors." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('cb_theme') || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
